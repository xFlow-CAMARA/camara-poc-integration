services:
  # ======================= 5G CORE SIMULATOR =======================
  core-simulator:
    build: ../coresim/core-simulator/
    image: openexposure/coresim:local
    container_name: core-simulator
    volumes:
      - ../coresim/artifacts/docker-compose/config/coreSim.yaml:/etc/config.yaml
    ports:
      - "8080:8080"  # SBI API
      - "8081:8081"  # OAM API
      - "9090:9090"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - camara-net
    restart: unless-stopped

  # ======================= NEF NORTHBOUND SERVICES (3GPP APIs) =======================
  as-session-with-qos:
    build: ../nef/as-session-with-qos/
    container_name: 3gpp-as-session-with-qos
    image: openexposure/as-session-with-qos:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8100:8080"
    volumes:
      - ../nef/config/asSessionWithQos.yaml:/etc/config.yaml
    networks:
      - camara-net
    depends_on:
      - ue-profile
      - ue-identity
      - core-network-service

  traffic-influence:
    build: ../nef/traffic-influence/
    container_name: 3gpp-traffic-influence
    image: openexposure/traffic-influence:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8101:8080"
    volumes:
      - ../nef/config/trafficInfluence.yaml:/etc/config.yaml
    networks:
      - camara-net
    depends_on:
      - ue-profile
      - ue-identity
      - core-network-service

  monitoring-event:
    build: ../nef/monitoring-event/
    container_name: 3gpp-monitoring-event
    image: openexposure/monitoring-event:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8102:8080"
    volumes:
      - ../nef/config/monitoringEvent.yaml:/etc/config.yaml
    networks:
      - camara-net
    depends_on:
      - ue-profile
      - ue-identity
      - core-network-service

  ue-id:
    build: ../nef/ue-id/
    container_name: 3gpp-ueid
    image: openexposure/ue-id:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../nef/config/ueId.yaml:/etc/config.yaml
    networks:
      - camara-net
    depends_on:
      - ue-identity

  ue-address:
    build: ../nef/ue-address/
    container_name: 3gpp-ue-address
    image: openexposure/ue-address:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../nef/config/ueAddress.yaml:/etc/config.yaml
    networks:
      - camara-net
    depends_on:
      - ue-identity

  # ======================= NEF MIDDLEWARE SERVICES =======================
  ue-profile:
    build: ../nef/ue-profile-service/
    container_name: ue-profile-service
    image: openexposure/ue-profile-service:local
    environment:
      - REDIS_SVC=redis:6379
      - NBI_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - camara-net
    depends_on:
      - redis

  ue-identity:
    build: ../nef/ue-identity-service/
    container_name: ue-identity-service
    image: openexposure/ue-identity-service:local
    environment:
      - REDIS_SVC=redis:6379
      - NBI_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    networks:
      - camara-net
    depends_on:
      - redis

  dataset-exporter:
    build: ../nef/dataset-exporter/
    container_name: dataset-exporter
    image: openexposure/dataset-exporter:local
    environment:
      - REDIS_SVC=redis:6379
      - HTTP_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    networks:
      - camara-net
    depends_on:
      - redis

  # ======================= NEF SOUTHBOUND SERVICES =======================
  core-network-service:
    build: ../nef/core-network-service/
    container_name: core-network-service
    image: openexposure/core-network-service:local
    ports:
      - "9092:9090"
    environment:
      - USE_NRF=False
      - CN_HTTP_VERSION=2
      - REDIS_ADDR=redis:6379
      - AMF_IP_ADDR=http://core-simulator:8080
      - SMF_IP_ADDR=http://core-simulator:8080
      - EVENT_NOTIFY_URI=http://core-network-service:9090
      - AMF_API_ROUTE=/eventsubscriptions/amf
      - SMF_API_ROUTE=/eventsubscriptions/smf
      - SERVER_ADDR=0.0.0.0:9090
    networks:
      - camara-net
    depends_on:
      - redis
      - core-simulator

  # ======================= NEF INGRESS CONTROLLER =======================
  nef-ingress:
    container_name: nef-ingress-controller
    image: nginx:latest
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ../nef/config/ingress.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - as-session-with-qos
      - traffic-influence
      - monitoring-event
      - ue-id
      - ue-address
    networks:
      - camara-net
    restart: unless-stopped

  # ======================= DATA STORES =======================
  redis:
    image: redis/redis-stack-server:latest
    container_name: nef-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - camara-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: nef-redisinsight
    ports:
      - "8002:8001"
    restart: unless-stopped
    networks:
      - camara-net
    depends_on:
      - redis

  # ======================= MONITORING =======================
  coresim-prometheus:
    image: prom/prometheus:latest
    container_name: coresim-prometheus
    volumes:
      - ../coresim/artifacts/docker-compose/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - coresim-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9091:9090"
    networks:
      - camara-net
    restart: unless-stopped
    depends_on:
      - core-simulator

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ../coresim/artifacts/docker-compose/config/grafana/dashboards:/var/lib/grafana/dashboards/coresim
      - ./config/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/default.yml
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/default.yml
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards/camara
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_INSTALL_PLUGINS=grafana-mongodb-datasource
    networks:
      - camara-net
    restart: unless-stopped
    depends_on:
      - coresim-prometheus
      - mongodb

  # ======================= IDENTITY & ACCESS MANAGEMENT =======================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME_URL=http://keycloak:8080
      - KC_HOSTNAME_ADMIN_URL=http://keycloak:8080
    volumes:
      - ./config/keycloak/camara-realm.json:/opt/keycloak/data/import/camara-realm.json
    ports:
      - "8180:8080"
    networks:
      - camara-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ======================= CAMARA PLATFORM =======================
  tf-sdk-api:
    build:
      context: ../tf-sdk
      dockerfile: Dockerfile
    container_name: tf-sdk-api
    ports:
      - "8200:8200"
    environment:
      - CORESIM_BASE_URL=http://core-simulator:8080
      - OAI_BASE_URL=http://oai-amf:80
      - REDIS_ADDR=nef-redis:6379
      - NEF_CALLBACK_URL=http://core-network-service:9090/eventsubscriptions
      - NEF_QOD_BASE_URL=http://3gpp-as-session-with-qos:8080
      - NEF_LOCATION_BASE_URL=http://3gpp-monitoring-event:8080
      - NEF_TI_BASE_URL=http://3gpp-traffic-influence:8080
      - NEF_UE_IDENTITY_BASE_URL=http://ue-identity-service:8080
      - MONGODB_URI=mongodb://mongodb:27017/camara
      - PYTHONUNBUFFERED=1
    volumes:
      - ../tf-sdk:/app
      - ../nef/config:/config
      - ../coresim/artifacts/docker-compose/config:/coresim-config
      - ../oai-core:/oai-core:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - camara-net
    restart: unless-stopped
    depends_on:
      - core-simulator
      - nef-ingress
      - mongodb
    command: python api_server.py

  kong:
    image: kong:3.9
    container_name: kong-gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yaml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PLUGINS=bundled
      - KONG_LOG_LEVEL=warn
      - KONG_UNTRUSTED_LUA=on
      - KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES=resty.http,cjson
    volumes:
      - ./config/kong/kong.yaml:/etc/kong/kong.yaml:ro
    ports:
      - "8000:8000"   # Kong proxy (CAMARA API entry point)
      - "8001:8001"   # Kong Admin API
    networks:
      - camara-net
    depends_on:
      - tf-sdk-api
      - keycloak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  camara-dashboard:
    build:
      context: ../camara-dashboard
      dockerfile: Dockerfile
    container_name: camara-dashboard
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - TF_SDK_URL=http://kong-gateway:8000
      - NEXT_PUBLIC_API_URL=http://kong-gateway:8000
      - NEXT_PUBLIC_GRAFANA_URL=http://grafana:3000
      - MONGODB_URI=mongodb://mongodb:27017/camara
      - INVOKER_ONBOARDING_URL=http://invoker-onboarding:8080
      - APP_ENV=${APP_ENV:-dev}
      - NEXTAUTH_URL=http://localhost:3100
      - NEXTAUTH_SECRET=camara-portal-secret-2026
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=camara
      - KEYCLOAK_CLIENT_ID=camara-dashboard-app
      - KEYCLOAK_CLIENT_SECRET=dashboard-secret-2026
      - KONG_INTERNAL_URL=http://kong-gateway:8000
      - INVOKER_ADMIN_API_KEY=${INVOKER_ADMIN_API_KEY:-}
      - INVOKER_DEV_API_KEY=${INVOKER_DEV_API_KEY:-}
    networks:
      - camara-net
    restart: unless-stopped
    depends_on:
      - kong
      - grafana
      - mongodb
      - invoker-onboarding

  mongodb:
    image: mongo:7.0
    container_name: camara-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=camara
    volumes:
      - mongodb-data:/data/db
      - ./config/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - camara-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================= CAPIF PROVIDER SERVICE =======================
  capif-service:
    build:
      context: ../nef/capif-service
      dockerfile: Dockerfile
    container_name: capif-service
    ports:
      - "8091:8080"
    environment:
      - CAPIF_FQDN=capifcore
      - CAPIF_AUTH_PORT=443
      - CAPIF_USERNAME=nef-xflow
      - CAPIF_PASSWORD=xflow-nef-2026
      - INGRESS_FQDN=nef-ingress-controller:80
    networks:
      - camara-net
      - capif-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ======================= DEVELOPER PORTAL =======================
  invoker-onboarding:
    build:
      context: ../nef/invoker-onboarding
      dockerfile: Dockerfile
    container_name: invoker-onboarding
    ports:
      - "8090:8080"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - CAPIF_CORE_URL=https://nginx:443
      - CAPIF_REGISTER_URL=https://register:8080
      - CAPIF_USERNAME=nef-xflow
      - CAPIF_PASSWORD=xflow-nef-2026
      - CAPIF_SERVICE_URL=http://capif-service:8080
      - CAPIF_TLS_VERIFY=${CAPIF_TLS_VERIFY:-false}
      - MONGODB_URI=mongodb://camara-mongodb:27017/camara
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=camara
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - CAPIF_REDIS_URL=redis://services-redis-1:6379/0
      - INVOKER_ADMIN_API_KEY=${INVOKER_ADMIN_API_KEY:-}
      - INVOKER_DEV_API_KEY=${INVOKER_DEV_API_KEY:-}
    networks:
      - camara-net
      - capif-network
    restart: unless-stopped
    depends_on:
      - mongodb
      - keycloak
      - capif-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  camara-net:
    driver: bridge
    name: xflow
  capif-network:
    external: true
    name: capif-network

volumes:
  coresim-prometheus-data:
  grafana-data:
  mongodb-data:
